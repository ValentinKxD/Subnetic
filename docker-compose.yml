# Subnetic у Docker: docker compose up -d --build → http://localhost:3001 (інший порт: APP_PORT=8080)
# База: ./docker-data/subnetic.db — у DB Browser редагувати лише при зупинених контейнерах (docker compose stop).
services:
  app:
    build: .
    container_name: subnetic-app
    ports:
      - "${APP_PORT:-3001}:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      SUBNETIC_DB: /data/subnetic.db
    volumes:
      - ./docker-data:/data
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: subnetic-bot
    env_file:
      - path: ./bot/.env
        required: false
    environment:
      # Шлях усередині контейнера (у bot/.env він для локального запуску).
      DB_PATH: /data/subnetic.db
    volumes:
      - ./docker-data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
